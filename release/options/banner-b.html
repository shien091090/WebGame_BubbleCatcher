<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bubble Tempo 橫幅 B — 舞廳光門</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 橫幅 B: 第 2 首舞廳。右側放大的遊戲場: 八邊網牆右邊亮起金色光門(要方形), 一顆金色方泡泡帶踩拍光暈正被送過去;
// 內圈舞池上有染色地板與其他泡泡。左側兩行大標題, 旁邊是鏡球與帷幕。左下角只有帷幕與像素玫瑰。
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 1680, H = 720, P = Art.palette[2];
  var FONT = '"Arial Rounded MT Bold", "Arial Black", "Segoe UI", "Microsoft JhengHei", sans-serif';

  function title(str, x, y, maxW, px, fill, stroke, glow) {
    ctx.save();
    ctx.font = '900 ' + px + 'px ' + FONT;
    var w = ctx.measureText(str).width;
    if (w > maxW) { px = Math.floor(px * maxW / w); ctx.font = '900 ' + px + 'px ' + FONT; }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.shadowColor = glow; ctx.shadowBlur = 26;
    ctx.lineWidth = Math.round(px * 0.15); ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
    ctx.restore();
    return px;
  }

  // 背景: 舞廳背景接兩段 — 左段取設計區 0~640(左帷幕、左鏡球、左下玫瑰), 右段取設計區 240~1280(右帷幕、右鏡球)
  ctx.save();
  ctx.fillStyle = P.bgMid; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, 640, H); ctx.clip();
  Art.drawBackground(ctx, { level: 2, time: 0.6 });
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(640, 0, W - 640, H); ctx.clip();
  ctx.translate(400, 0);
  Art.drawBackground(ctx, { level: 2, time: 1.4 });
  ctx.restore();

  // 遊戲場: 設計區圓心 (640,360) 放到 (1140,360), 放大 1.28 倍(網牆上下被裁, 光門在右)
  var GX = 1140, GY = 360, k = 1.28;
  ctx.save();
  ctx.translate(GX, GY); ctx.scale(k, k); ctx.translate(-640, -360);
  // 外圈一層深色, 讓網牆從帷幕與磚牆上浮出
  var fog = ctx.createRadialGradient(640, 360, 250, 640, 360, 420);
  fog.addColorStop(0, 'rgba(10,4,24,0.75)'); fog.addColorStop(1, 'rgba(10,4,24,0)');
  ctx.fillStyle = fog; ctx.beginPath(); ctx.arc(640, 360, 420, 0, Math.PI * 2); ctx.fill();
  Art.drawArena(ctx, { level: 2 });
  Art.drawHpRing(ctx, { level: 2, hp: 78, danger: false, time: 0 });
  Art.drawBeatCue(ctx, { level: 2, phase: 0.72, beat: 12.72 });
  Art.drawNetWall(ctx, { level: 2, lit: { slot: 1, color: 'A', shape: 'square' } });
  // 染色地板(環上 60° 一格)
  var R = 140, D = Math.PI / 180;
  Art.drawDyeFloor(ctx, { level: 2, x: 640 + R * Math.cos(120 * D), y: 360 + R * Math.sin(120 * D), color: 'B', status: 'active' });
  Art.drawDyeFloor(ctx, { level: 2, x: 640 + R * Math.cos(180 * D), y: 360 + R * Math.sin(180 * D), color: 'C', status: 'active' });
  Art.drawShapeFloor(ctx, { level: 2, x: 640 + R * Math.cos(240 * D), y: 360 + R * Math.sin(240 * D), shape: 'square', status: 'active' });
  Art.drawDyeFloor(ctx, { level: 2, x: 640 + R * Math.cos(300 * D), y: 360 + R * Math.sin(300 * D), color: 'A', status: 'active' });
  // 其他泡泡
  Art.drawBubble(ctx, { level: 2, x: 590, y: 420, color: null, shape: 'circle', status: 'idle', life: 0.8 });
  Art.drawBubble(ctx, { level: 2, x: 700, y: 290, color: 'D', shape: 'triangle', status: 'idle', life: 0.55 });
  Art.drawBubble(ctx, { level: 2, x: 560, y: 300, color: 'C', shape: 'circle', status: 'idle', life: 0.9 });
  ctx.restore();

  // 主角: 金色方泡泡, 正被拖向右邊光門(拿起 = 影子拉遠), 帶踩拍 2 級共鳴; 畫得比場內大一號
  ctx.save();
  ctx.translate(GX + 175 * k, GY + 22 * k); ctx.scale(2.2, 2.2);
  Art.drawBeatFx(ctx, { level: 2, x: 0, y: 0, tier: 2, t: 0.05, onBubble: true });
  Art.drawBubble(ctx, { level: 2, x: 0, y: 0, color: 'A', shape: 'square', status: 'dragging', life: 0.7 });
  ctx.restore();

  // 標題: 左側兩行, 置中於 x 460(限寬 500 → 約 210 ~ 710, 避開左鏡球與網牆)
  var px = title('Bubble', 460, 248, 500, 150, '#fff6e6', '#2a0f44', 'rgba(255,215,122,0.85)');
  title('Tempo', 460, 248 + px * 1.0, 500, px, '#ffd77a', '#2a0f44', 'rgba(255,215,122,0.85)');
})();
</script>
</body>
</html>
