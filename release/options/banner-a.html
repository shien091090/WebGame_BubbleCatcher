<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bubble Tempo 橫幅 A — 林間泡泡排排站</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 橫幅 A: 第 1 首林間。上方大標題, 下方一排五顆泡泡沿弧線排排站(四色 + 透明, 圓 / 方 / 三角),
// 正中的葡萄紫泡泡最大、帶踩拍 3 級共鳴輪廓。左下角(x < 420, y > 504)只有草叢與樹。
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 1680, H = 720, P = Art.palette[1];
  var FONT = '"Arial Rounded MT Bold", "Arial Black", "Segoe UI", "Microsoft JhengHei", sans-serif';

  function title(str, x, y, maxW, px, fill, stroke, glow) {
    ctx.save();
    ctx.font = '900 ' + px + 'px ' + FONT;
    var w = ctx.measureText(str).width;
    if (w > maxW) { px = Math.floor(px * maxW / w); ctx.font = '900 ' + px + 'px ' + FONT; }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.shadowColor = glow; ctx.shadowBlur = 24;
    ctx.lineWidth = Math.round(px * 0.16); ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
    ctx.restore();
  }

  // 背景: 林間背景等比放大到 1680 寬, 垂直置中裁切
  ctx.save();
  ctx.fillStyle = P.bgMid; ctx.fillRect(0, 0, W, H);
  var k = W / 1280;
  ctx.translate(0, (H - 720 * k) / 2); ctx.scale(k, k);
  Art.drawBackground(ctx, { level: 1 });
  ctx.restore();
  // 舞台: 泡泡排下方一道橢圓林蔭(壓暗、讓泡泡浮出), 只在 x ≥ 430
  ctx.save();
  var sg = ctx.createRadialGradient(860, 420, 60, 860, 420, 560);
  sg.addColorStop(0, 'rgba(8,46,30,0.6)'); sg.addColorStop(0.6, 'rgba(8,46,30,0.35)'); sg.addColorStop(1, 'rgba(8,46,30,0)');
  ctx.beginPath(); ctx.ellipse(860, 420, 560, 200, 0, 0, Math.PI * 2);
  ctx.fillStyle = sg; ctx.fill();
  ctx.restore();

  // 標題(上方, 置中於 x 860, 限寬 1160 → 約 280 ~ 1440)
  title('Bubble Tempo', 860, 150, 1160, 148, '#ffffff', '#163d36', 'rgba(63,240,216,0.9)');

  // 排排站: 五顆泡泡沿弧線
  var row = [
    { x: 480, y: 440, s: 2.7, color: 'D', shape: 'circle' },
    { x: 670, y: 418, s: 2.9, color: 'B', shape: 'square' },
    { x: 860, y: 404, s: 3.5, color: 'A', shape: 'circle', hero: true },
    { x: 1050, y: 418, s: 2.9, color: 'C', shape: 'triangle' },
    { x: 1240, y: 440, s: 2.7, color: null, shape: 'circle' }
  ];
  for (var i = 0; i < row.length; i++) {
    var b = row[i];
    ctx.save();
    ctx.translate(b.x, b.y); ctx.scale(b.s, b.s);
    if (b.hero) Art.drawBeatFx(ctx, { level: 1, x: 0, y: 0, tier: 3, t: 0.05, onBubble: true });
    Art.drawBubble(ctx, { level: 1, x: 0, y: 0, color: b.color, shape: b.shape, status: 'idle', life: 1 });
    ctx.restore();
  }
})();
</script>
</body>
</html>
